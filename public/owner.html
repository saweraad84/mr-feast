<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mr. Feast Owner Dashboard</title><style>body{font-family:Arial;background:#f7f0df;color:#172522;margin:0;padding:25px}.wrap{max-width:1100px;margin:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.card{background:#fff;border-radius:14px;padding:18px}.stat b{font-size:30px;color:#6b1f2b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.login{max-width:400px;margin:80px auto;background:#fff;padding:25px;border-radius:16px}.login input,.login button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0}.login button{background:#6b1f2b;color:#fff;border:0}.order{border-bottom:1px solid #ddd;padding:10px 0}@media(max-width:700px){.stats,.grid{grid-template-columns:1fr}}</style></head><body><div id="gate" class="login"><h2>Owner Login</h2><input id="pw" type="password" placeholder="Admin password"><button id="go">Login</button><p id="msg"></p></div><main id="app" class="wrap" style="display:none"><h1>Owner Dashboard</h1><div class="stats"><div class="stat">Queue<br><b id="sq">0</b></div><div class="stat">Cooking<br><b id="sc">0</b></div><div class="stat">Ready<br><b id="sr">0</b></div><div class="stat">Completed<br><b id="sd">0</b></div></div><div class="grid"><section class="card"><h2>Item / Deal Figures</h2><div id="items"></div></section><section class="card"><h2>Completed Orders</h2><div id="done"></div></section></div></main><script>const $=x=>document.getElementById(x);$('go').onclick=async()=>{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});if(r.ok){$('gate').style.display='none';$('app').style.display='block';load()}else $('msg').textContent='Wrong password'};async function load(){const a=await fetch('/api/admin/orders').then(r=>r.json());$('sq').textContent=a.filter(x=>x.status==='queue').length;$('sc').textContent=a.filter(x=>x.status==='cooking').length;$('sr').textContent=a.filter(x=>x.status==='ready').length;$('sd').textContent=a.filter(x=>x.status==='completed').length;const m={};a.forEach(o=>o.items.forEach(x=>m[x.name]=(m[x.name]||0)+Number(x.qty)));$('items').innerHTML=Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([n,q])=>`<div class="order"><b>${n}</b><span style="float:right">${q}</span></div>`).join('')||'No order data yet';$('done').innerHTML=a.filter(x=>x.status==='completed').map(o=>`<div class="order"><b>#${o.id} · ${o.customer_name}</b><span style="float:right">Rs. ${o.total}</span><br><small>${new Date(o.created_at).toLocaleString()}</small></div>`).join('')||'No completed orders yet'}</script></body></html>
