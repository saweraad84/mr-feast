<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Status | Mr. Feast</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/theme.css"><style>body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% 10%,rgba(107,31,43,.25),transparent 32%),#111;color:#fff}.track-shell{max-width:780px;margin:auto;padding:44px 20px 90px}.track-card{margin-top:32px;background:#fff9f2;color:#1b1817;border:1px solid rgba(201,164,92,.45);border-radius:24px;padding:28px;box-shadow:0 28px 80px #0007}.track-card h1{font:700 clamp(34px,7vw,54px)/1 Georgia,serif;margin:8px 0 15px}.status-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:24px 0}.status-flow span{padding:11px 6px;border-radius:10px;background:#e8dccf;text-align:center;font-size:11px;font-weight:900}.status-flow span.on{background:#6b1f2b;color:#fff}.track-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.track-grid div{padding:13px;border-radius:12px;background:#f5ece3}.track-grid b{display:block;color:#6b1f2b;font-size:10px;text-transform:uppercase;margin-bottom:5px}.items{margin:18px 0;display:grid;gap:7px}.items div{display:flex;justify-content:space-between;border-bottom:1px solid #e0d4c7;padding:8px 0}.track-msg{font-weight:800;color:#6b1f2b}.home{display:inline-block;margin-top:22px;padding:11px 16px;border-radius:999px;background:#6b1f2b;color:#fff;font-weight:900}@media(max-width:600px){.track-grid{grid-template-columns:1fr}.status-flow{grid-template-columns:1fr 1fr}}</style></head><body><main class="track-shell"><a class="brand" href="/"><b>MR.</b> FEAST</a><section class="track-card"><span class="kicker teal">LIVE ORDER STATUS</span><h1 id="orderTitle">Loading order…</h1><div class="status-flow" id="statusFlow"><span data-s="queue">Queue</span><span data-s="cooking">Cooking</span><span data-s="ready">Ready</span><span data-s="completed">Completed</span></div><div class="track-grid" id="trackGrid"></div><div class="items" id="orderItems"></div><div class="track-msg" id="trackMsg"></div><a class="home" href="/">Back to Mr. Feast</a></section></main><script src="/order-status.js"></script></body></html>
