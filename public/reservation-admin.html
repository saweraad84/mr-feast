<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mr. Feast Reservation Admin</title>
<style>:root{--black:#111;--wine:#6B1F2B;--gold:#C9A45C;--cream:#F5EFE6;--card:#FFF9F2;--line:#e3d7c5;--muted:#756960}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#1b1817;font-family:Arial,Helvetica,sans-serif}.login{max-width:430px;margin:10vh auto;background:#fff;padding:26px;border-radius:18px;border:1px solid var(--line)}input,select,button{font:inherit}.login input,.login button{width:100%;padding:12px;margin:7px 0;border-radius:9px;border:1px solid var(--line)}button{cursor:pointer}.primary{background:var(--wine);color:#fff;border:0;font-weight:800}.wrap{max-width:1450px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.brand{font-size:27px;font-weight:900}.brand b{color:var(--wine)}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{background:var(--black);color:#fff;text-decoration:none;padding:10px 12px;border-radius:9px;font-weight:800}.toolbar{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:20px 0;display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end}.toolbar label{font-size:12px;font-weight:800}.toolbar input,.toolbar select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;margin-top:5px}.toolbar button{padding:11px 14px;border:0;border-radius:9px;background:var(--wine);color:#fff;font-weight:800}.summary{color:var(--muted);margin:8px 0 16px}.list{display:grid;gap:14px}.reservation{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.reservation-head{display:flex;justify-content:space-between;gap:14px;align-items:start}.reservation-head h3{margin:0;color:var(--wine)}.time{font-weight:900}.details{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:15px}.field{background:var(--card);border:1px solid #eee2d0;border-radius:10px;padding:10px;min-width:0}.field small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}.field div{overflow-wrap:anywhere}.status-select{min-width:150px;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:800}.save-state{font-size:11px;color:var(--muted);margin-top:5px;text-align:right}.error{color:#9a3333}.ok{color:#2f7d4a}.empty{background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--muted)}@media(max-width:1000px){.details{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{grid-template-columns:1fr 1fr}.reservation-head{flex-direction:column}.save-state{text-align:left}}@media(max-width:600px){.wrap{padding:12px}.details,.toolbar{grid-template-columns:1fr}}</style></head>
<body><div id="gate" class="login"><div class="brand"><b>MR.</b> FEAST</div><h2>Reservation Admin Login</h2><input id="pw" type="password" placeholder="Admin password" autocomplete="current-password"><button id="go" class="primary">Login</button><p id="msg"></p></div>
<main id="app" style="display:none"><div class="wrap"><div class="top"><div><div class="brand"><b>MR.</b> FEAST RESERVATIONS</div><div id="status" class="summary">Loading reservations…</div></div><div class="links"><a href="/admin.html">Main Admin</a><a href="/reservations-calendar.html">Calendar</a><a href="/">Website</a></div></div>
<div class="toolbar"><label>Search<input id="search" placeholder="Name, phone, email, reservation ID"></label><label>Status<select id="statusFilter"><option value="">All statuses</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="seated">Seated</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></label><label>Date<input id="dateFilter" type="date"></label><button id="refresh">Refresh</button></div><div id="list" class="list"></div></div></main>
<script src="/reservation-admin.js"></script></body></html>
