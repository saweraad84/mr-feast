ation…</h1><p id="manageIntro">This secure link shows the reservation information Mr. Feast has enabled for customers.</p><div class="manage-grid" id="manageGrid"></div><div class="manage-actions" id="manageActions"><a class="home-link" href="/">Back to Mr. Feast</a></div><div class="manage-msg" id="manageMsg"></div></section></main><script src="/manage-reservation.js"></script></body></html>
