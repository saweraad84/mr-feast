<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mr. Feast Reservation Calendar</title><style>body{font-family:Arial,sans-serif;background:#171717;color:#fff;margin:0;padding:24px}.login{max-width:420px;margin:80px auto;background:#262020;padding:26px;border-radius:18px}.login h2{margin-top:0;color:#d7b36a}.login input,.login button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:9px;border:0}.login button{background:#d7b36a;color:#171717;font-weight:800;cursor:pointer}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.top h1{margin:0;color:#d7b36a}.top button{background:#6b1f2b;color:#fff;border:0;padding:10px 14px;border-radius:9px;font-weight:800;cursor:pointer}.calendar{background:#241f20;border-radius:18px;padding:18px}.cal-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:10px;margin-bottom:10px}.cal-head h2{text-align:center;margin:0}.cal-head button{height:40px;border:0;border-radius:10px;background:#6b1f2b;color:#fff;font-size:22px;cursor:pointer}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.week div{text-align:center;color:#d8c8bd;font-size:12px;font-weight:800;padding:8px 0}.day{min-height:120px;background:#fff;color:#222;border-radius:12px;padding:9px;box-sizing:border-box;border:2px solid transparent;overflow:hidden}.day.other{opacity:.28}.day.today{border-color:#d7b36a}.date-num{font-weight:900;margin-bottom:6px}.booking{background:#f6e9e2;border-left:4px solid #6b1f2b;border-radius:7px;padding:6px;margin:5px 0;font-size:11px;line-height:1.35}.booking b{display:block;color:#6b1f2b}.empty{color:#8c7c74;font-size:11px}.legend{display:flex;gap:16px;flex-wrap:wrap;color:#d8c8bd;font-size:12px;margin-top:14px}.status{font-size:12px;color:#d7b36a}.error{color:#ffb3b3}.table-wrap{margin-top:22px;background:#241f20;padding:16px;border-radius:16px;overflow:auto}.table-wrap h3{margin-top:0;color:#d7b36a}table{width:100%;border-collapse:collapse;min-width:800px}th,td{text-align:left;padding:10px;border-bottom:1px solid #403638;font-size:13px}th{color:#d7b36a}select{padding:7px;border-radius:7px} @media(max-width:900px){body{padding:12px}.day{min-height:95px;padding:6px}.booking{font-size:10px}.week,.grid{gap:4px}}</style></head><body><div id="gate" class="login"><h2>Reservation Calendar Login</h2><input id="pw" type="password" placeholder="Admin password"><button id="go">Login</button><p id="msg"></p></div><main id="app" style="display:none"><div class="top"><div><h1>Mr. Feast Reservation Calendar</h1><div id="status" class="status">Loading reservations…</div></div><button id="refresh">Refresh</button></div><section class="calendar"><div class="cal-head"><button id="prev">‹</button><h2 id="monthTitle"></h2><button id="next">›</button></div><div class="week"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div><div id="grid" class="grid"></div><div class="legend"><span>Shows reservation time, guest name and party size</span><span>All times use 24-hour format</span></div></section><section class="table-wrap"><h3>Reservation List</h3><table><thead><tr><th>ID</th><th>Date</th><th>Time</th><th>Name</th><th>Guests</th><th>Phone</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const $=id=>document.getElementById(id);let reservations=[],view=new Date();view=new Date(view.getFullYear(),view.getMonth(),1);async function login(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});if(r.ok){$('gate').style.display='none';$('app').style.display='block';await load()}else $('msg').textContent='Wrong password'}$('go').onclick=login;$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});function isoLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function dateOnly(v){return String(v||'').slice(0,10)}function fmtTime(v){return String(v||'').slice(0,5)}async function load(){try{const r=await fetch('/api/admin/reservations');if(!r.ok)throw new Error('Could not load reservations');reservations=await r.json();$('status').textContent=reservations.length+' reservations loaded';render()}catch(e){$('status').textContent=e.message;$('status').classList.add('error')}}function render(){const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate();$('monthTitle').textContent=new Intl.DateTimeFormat('en-GB',{month:'long',year:'numeric'}).format(view);let html='';for(let i=first-1;i>=0;i--){const d=new Date(y,m-1,prevDays-i);html+=cell(d,true)}for(let d=1;d<=days;d++)html+=cell(new Date(y,m,d),false);const used=first+days,remain=(7-used%7)%7;for(let d=1;d<=remain;d++)html+=cell(new Date(y,m+1,d),true);$('grid').innerHTML=html;renderTable()}function cell(d,other){const iso=isoLocal(d),items=reservations.filter(r=>dateOnly(r.reservation_date)===iso),today=iso===isoLocal(new Date());return `<div class="day${other?' other':''}${today?' today':''}"><div class="date-num">${d.getDate()}</div>${items.length?items.map(r=>`<div class="booking"><b>${fmtTime(r.reservation_time)}–${fmtTime(r.end_time)} · ${r.party_size} guest${Number(r.party_size)===1?'':'s'}</b>${esc(r.customer_name||'')} · ${esc(r.status||'pending')}</div>`).join(''):'<div class="empty">No reservations</div>'}</div>`}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function renderTable(){const sorted=[...reservations].sort((a,b)=>String(b.reservation_date).localeCompare(String(a.reservation_date))||String(b.reservation_time).localeCompare(String(a.reservation_time)));$('rows').innerHTML=sorted.map(r=>`<tr><td>#${r.id}</td><td>${dateOnly(r.reservation_date)}</td><td>${fmtTime(r.reservation_time)}–${fmtTime(r.end_time)}</td><td>${esc(r.customer_name||'')}</td><td>${r.party_size}</td><td>${esc(r.phone||'')}</td><td>${esc(r.status||'pending')}</td></tr>`).join('')||'<tr><td colspan="7">No reservations yet.</td></tr>'} $('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};$('refresh').onclick=load;setInterval(()=>{if($('app').style.display!=='none')load()},30000);</script></body></html>
