<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mr. Feast Admin</title><style>body{font-family:Arial,sans-serif;background:#f7f0df;color:#172522;margin:0}.wrap{max-width:900px;margin:40px auto;padding:20px}.card{background:#fffaf0;border:1px solid #e4dac6;border-radius:18px;padding:24px;margin-bottom:20px}.brand{font-size:28px;font-weight:800}.brand b{color:#0b5b59}.muted{color:#6d7975}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:700;margin-bottom:8px}input,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #d8cdb7;font:inherit}button{background:#0b5b59;color:white;border:0;font-weight:800;cursor:pointer}.danger{background:#7a2b2b}.status{margin-top:12px;font-weight:700}.preview{max-width:100%;height:220px;object-fit:cover;border-radius:12px;margin-top:14px;display:none}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.top button{width:auto;padding:10px 16px}@media(max-width:650px){.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand"><b>MR.</b> FEAST ADMIN</div><p class="muted">Change menu pictures without editing code.</p></div><button id="logout" style="display:none">Logout</button></div><div id="loginCard" class="card"><h2>Admin Login</h2><label>Password</label><input id="password" type="password" placeholder="Enter admin password"><br><br><button id="login">Login</button><div id="loginStatus" class="status"></div></div><div id="manager" class="card" style="display:none"><h2>Change Food Picture</h2><div class="row"><div><label>Menu item</label><select id="item"></select></div><div><label>New picture</label><input id="image" type="file" accept="image/*"></div></div><img id="preview" class="preview"><br><button id="save">Save New Picture</button><div id="saveStatus" class="status"></div><hr style="margin:24px 0;border:0;border-top:1px solid #e4dac6"><button id="reset" class="danger">Reset Selected Item To Original Picture</button></div></div><script src="/admin.js"></script></body></html>
