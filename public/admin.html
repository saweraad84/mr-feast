<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mr. Feast Admin</title><style>body{font-family:Arial;background:#f7f0df;color:#172522;margin:0}.wrap{max-width:1100px;margin:35px auto;padding:20px}.card{background:#fffaf0;border:1px solid #e4dac6;border-radius:18px;padding:24px;margin:18px 0}.brand{font-size:28px;font-weight:800}.brand b{color:#6b1f2b}.muted{color:#6d7975}.top,.line{display:flex;justify-content:space-between;gap:16px;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{display:block;font-weight:700;font-size:13px}input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #d8cdb7;font:inherit;margin-top:6px}button{background:#6b1f2b;color:white;border:0;font-weight:800;cursor:pointer}.ghost{background:#172522}.danger{background:#9a3333}.small{width:auto}.password-wrap{position:relative}.password-wrap button{position:absolute;right:6px;top:6px;width:46px;background:transparent;color:#333;font-size:18px}.deal,.review{border:1px solid #e4dac6;border-radius:14px;padding:16px;margin:12px 0;background:white}.deal img{width:120px;height:85px;object-fit:cover;border-radius:10px}.actions{display:flex;gap:8px}.actions button{width:auto}.links{display:flex;gap:10px;flex-wrap:wrap}.links a{background:#172522;color:#fff;text-decoration:none;padding:10px 14px;border-radius:9px;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:1fr}.top,.line{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand"><b>MR.</b> FEAST ADMIN</div><p class="muted">Website content management.</p></div><button id="logout" class="small" style="display:none">Logout</button></div><div id="loginCard" class="card"><h2>Admin Login</h2><label>Password</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password"><button id="eye" type="button" aria-label="Show password">👁</button></div><button id="login">Login</button><div id="loginStatus"></div></div><div id="manager" style="display:none"><div class="card"><h2>Dashboards</h2><div class="links"><a href="/kitchen" target="_blank">Kitchen Dashboard ↗</a><a href="/owner" target="_blank">Owner Dashboard ↗</a></div></div><div class="card"><h2>Menu Pictures</h2><div class="grid"><label>Menu item<select id="item"></select></label><label>New picture<input id="image" type="file" accept="image/*"></label></div><button id="save">Save New Picture</button><button id="reset" class="danger">Restore Original Picture</button><div id="saveStatus"></div></div><div class="card"><h2>Deals</h2><p class="muted">Deals render in a centered responsive grid. Adding or deleting a deal will not break the page structure.</p><div class="grid"><label>Deal name<input id="dealName"></label><label>Price<input id="dealPrice" type="number"></label><label>Description<textarea id="dealDesc"></textarea></label><label>Picture<input id="dealImage" type="file" accept="image/*"></label></div><button id="addDeal">Add Deal</button><div id="dealList"></div></div><div class="card"><h2>Customer Reviews</h2><div class="grid"><label>Customer name<input id="reviewName"></label><label>Rating<select id="reviewRating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label></div><label>Review<textarea id="reviewText"></textarea></label><button id="addReview">Add Review</button><div id="reviewList"></div></div></div></div><script src="/admin.js"></script></body></html>
