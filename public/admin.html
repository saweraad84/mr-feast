<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mehfil-e-Zaika Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"><style>
:root{--maroon:#541c24;--maroon2:#2b0d12;--cream:#f7ecd5;--paper:#fff9ed;--gold:#c9a45c;--gold2:#e5ca8c;--ink:#211919;--muted:#766c64;--line:#dfcfaf;--dark:#110b0c}
*{box-sizing:border-box}body{font-family:'DM Sans',sans-serif;background:linear-gradient(180deg,#12090b 0,#2b0d12 230px,var(--cream) 230px,var(--cream) 100%);color:var(--ink);margin:0;min-height:100vh}.wrap{max-width:1180px;margin:0 auto;padding:34px 24px 70px}.top{min-height:138px;display:flex;justify-content:space-between;gap:20px;align-items:center;color:#fff}.brand{font-family:'Playfair Display',serif;font-size:34px;font-weight:800;letter-spacing:.4px;color:#f6e8ca}.brand b{color:var(--gold2)!important}.muted{color:var(--muted)}.top .muted{color:#d7c9bf;margin:8px 0 0}.card{background:rgba(255,249,237,.98);border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:22px;box-shadow:0 18px 50px rgba(43,13,18,.11)}h2,h3{font-family:'Playfair Display',serif;color:var(--maroon2)}h2{font-size:27px;margin-top:0}h3{font-size:21px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:800;margin:12px 0 8px;color:#49353a;font-size:12px;letter-spacing:.2px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:12px 13px;border-radius:9px;border:1px solid #d5c39f;background:#fffdf7;color:var(--ink);outline:none;transition:.2s}input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,164,92,.16)}button{width:100%;padding:12px 16px;border-radius:7px;border:1px solid #7c3944;background:var(--maroon);color:white;font-weight:800;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,background .18s ease}button:hover{background:#6a2530;transform:translateY(-1px);box-shadow:0 8px 20px rgba(84,28,36,.18)}.secondary{background:#8a7141!important;border-color:#a48a53!important}.secondary:hover{background:#755f35!important}.danger,.danger2{background:#7b2630!important;border-color:#7b2630!important}.status{margin-top:12px;font-weight:800;color:var(--maroon)}.preview{max-width:100%;height:220px;object-fit:cover;border-radius:12px;margin-top:14px;display:none;border:1px solid var(--line)}.top button{width:auto;padding:10px 18px;background:transparent;border-color:var(--gold);color:var(--gold2)}.top button:hover{background:var(--maroon)}hr{border-color:var(--line)!important}
/* Theme all dynamically injected admin editors */
.slider-manager,.content-admin{background:rgba(255,249,237,.98)!important}.slidecard,.editor{background:#fffdf7!important;border:1px solid var(--line)!important;border-radius:14px!important;box-shadow:0 10px 30px rgba(43,13,18,.06)}.slidecard h3,.editor h3{color:var(--maroon)!important}.slider-head a{color:var(--maroon)!important}.slidecard textarea,.editor textarea,.slidecard input,.editor input,.editor select{border-color:#d5c39f!important;background:#fffdf7!important;color:var(--ink)!important}.slidecard textarea:focus,.editor textarea:focus,.slidecard input:focus,.editor input:focus,.editor select:focus{border-color:var(--gold)!important;box-shadow:0 0 0 3px rgba(201,164,92,.16)!important}.listrow{border-color:var(--line)!important;background:#fffaf0!important}.listrow small,.tiny{color:var(--muted)!important}.check,.checkline{color:#49353a!important}.mini{background:var(--maroon)!important}.content-admin>h2,.slider-manager h2{color:var(--maroon2)!important}.editor button,.slidecard button{border-radius:7px!important}.slidecard .preview{border:1px solid var(--line);border-radius:10px!important}.content-grid{gap:20px!important}
@media(max-width:760px){.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column;padding:22px 0}.brand{font-size:28px}.wrap{padding:20px 14px 50px}body{background:linear-gradient(180deg,#12090b 0,#2b0d12 230px,var(--cream) 230px)}}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand" id="brand">MEHFIL-E-ZAIKA ADMIN</div><p class="muted">Manage menu, deals, food pictures and website sliders.</p></div><button id="logout" style="display:none">Logout</button></div><div id="loginCard" class="card"><h2>Admin Login</h2><label>Password</label><input id="password" type="password" placeholder="Enter admin password"><br><br><button id="login">Login</button><div id="loginStatus" class="status"></div></div><div id="manager" class="card" style="display:none"><h2>Change Food Picture</h2><div class="row"><div><label>Menu item</label><select id="item"></select></div><div><label>New picture</label><input id="image" type="file" accept="image/*"></div></div><img id="preview" class="preview"><br><button id="save">Save New Picture</button><div id="saveStatus" class="status"></div><hr style="margin:24px 0;border:0;border-top:1px solid #e4dac6"><button id="reset" class="danger">Reset Selected Item To Original Picture</button></div></div><script src="/admin.js"></script><script src="/admin-hero.js"></script></body></html>
