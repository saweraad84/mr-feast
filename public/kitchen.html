<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mr. Feast Kitchen</title><style>body{font-family:Arial;background:#171717;color:#fff;margin:0;padding:25px}h1{color:#d7b36a}.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.col{background:#242424;border-radius:16px;padding:16px;min-height:300px}.order{background:#fff;color:#222;border-radius:12px;padding:14px;margin:12px 0}.order small{color:#777}.order button{width:100%;padding:10px;border:0;border-radius:8px;background:#6b1f2b;color:#fff;font-weight:700;margin-top:8px;cursor:pointer}.login{max-width:400px;margin:80px auto;background:#242424;padding:25px;border-radius:16px}.login input,.login button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:8px;border:0}.login button{background:#d7b36a;font-weight:800}@media(max-width:800px){.cols{grid-template-columns:1fr}}</style></head><body><div id="gate" class="login"><h2>Kitchen Login</h2><input id="pw" type="password" placeholder="Admin password"><button id="go">Login</button><p id="msg"></p></div><main id="app" style="display:none"><h1>Mr. Feast Kitchen Dashboard</h1><p>Operator can move orders through Queue → Cooking → Ready.</p><div class="cols"><section class="col"><h2>Order in Queue</h2><div id="queue"></div></section><section class="col"><h2>Order in Cooking</h2><div id="cooking"></div></section><section class="col"><h2>Order Ready</h2><div id="ready"></div></section></div></main><script>const $=x=>document.getElementById(x);async function login(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});if(r.ok){$('gate').style.display='none';$('app').style.display='block';load()}else $('msg').textContent='Wrong password'}$('go').onclick=login;function card(o){return `<div class="order"><b>#${o.id} · ${o.customer_name}</b><br><small>${o.phone} · ${o.email}</small><p>${o.items.map(x=>`${x.qty}× ${x.name}`).join('<br>')}</p><b>Rs. ${o.total}</b>${o.notes?`<p>Note: ${o.notes}</p>`:''}${o.status==='queue'?`<button data-id="${o.id}" data-s="cooking">Start Cooking</button>`:o.status==='cooking'?`<button data-id="${o.id}" data-s="ready">Mark Ready</button>`:`<button data-id="${o.id}" data-s="completed">Complete Order</button>`}</div>`}async function load(){const a=await fetch('/api/admin/orders').then(r=>r.json());['queue','cooking','ready'].forEach(s=>$(s).innerHTML=a.filter(x=>x.status===s).map(card).join('')||'<small>No orders</small>')}document.body.onclick=async e=>{if(!e.target.dataset.s)return;await fetch('/api/admin/orders/'+e.target.dataset.id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:e.target.dataset.s})});load()};setInterval(()=>{if($('app').style.display!=='none')load()},15000);</script></body></html>
